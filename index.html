.tri{display:flex;flex-direction:column;gap:5px}

/* ─── lista de pessoas ──────────────────────────────────────────────────── */
/* Cada linha é uma ficha: filete de espectro à esquerda, nome, meta, o

.lista{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 9px;
      padding:8px 8px 8px 10px;border-bottom:1px solid var(--rule);cursor:pointer;

.item[data-e="1"]{border-left-color:#8a8f7e}
.item[data-e="2"]{border-left-color:var(--abaixo)}

.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.quadro{border:1px solid var(--rule);background:var(--surface);padding:14px}

/* pan-y: o dedo rola a página por cima do gráfico, que ocupa quase a tela

canvas{display:block;width:100%;cursor:crosshair;touch-action:pan-y}
svg{display:block;width:100%;overflow:visible}

.tri-ops.anos{grid-template-columns:none;grid-auto-flow:column;

/* ─── nota de leitura ───────────────────────────────────────────────────── */
.notas{margin-top:26px;border-top:1px solid var(--rule2);padding-top:16px}
.notas summary{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
               text-transform:uppercase;color:var(--ink2);cursor:pointer}
.notas .corpo{font-family:var(--serif);font-size:14px;line-height:1.5;
              max-width:none;color:var(--ink2);margin-top:9px;
              display:flex;flex-direction:column;gap:5px}
.notas .corpo p{margin:0}
.notas .corpo b{color:var(--ink)}
.vazio{font-family:var(--serif);font-size:17px;color:var(--ink2);padding:50px 0;
       max-width:50ch}

/* ─── controles do panorama ─────────────────────────────────────────────── */
.ferramentas{display:flex;gap:6px;align-items:center;margin-bottom:10px;
             flex-wrap:wrap}
.ferramentas .dizer{font-family:var(--mono);font-size:11px;color:var(--ink3);
                    margin-left:auto}
.bt{font-family:var(--mono);font-size:12px;padding:5px 10px;cursor:pointer;
    border:1px solid var(--rule2);background:var(--paper);color:var(--ink2);
    line-height:1;min-height:32px}
.bt:hover{border-color:var(--accent);color:var(--accent)}

.voltar-painel{display:inline-block;font-family:var(--mono);font-size:12px;
  color:var(--accent);padding:10px 22px 0;text-decoration:none}
.voltar-painel:hover{text-decoration:underline}

/* ─── gaveta de filtros (só aparece em tela estreita) ───────────────────── */
.gaveta-bt{display:none}
/* a aba Lista e o botão de volta só existem na coluna única, onde a lista
   não está mais ao lado e sim atrás de uma aba */
.aba-lista,.volta-lista{display:none}

@media (max-width:880px){
  /* minmax(0,1fr) e não 1fr: senão o conteúdo do rail que não encolhe (nomes
     longos, <select> de partido) estica a coluna e leva o gráfico junto para
     fora da tela */
  .tela{grid-template-columns:minmax(0,1fr)}
  /* em coluna única o panorama vem primeiro: o gráfico é o que a pessoa veio
     ver, e os filtros ficam logo abaixo dele em vez de empurrá-lo para fora
     da primeira tela */
  .palco{order:-1;padding:12px 14px 22px}
  /* o rail vira gaveta: fechado por padrão, para o resultado ficar à vista */
  .rail{position:static;max-height:none;border-right:none;
        border-top:1px solid var(--rule2);padding:12px 14px 24px;gap:13px}
  .rail[data-aberto="false"] .so-gaveta{display:none}

  /* Três abas em coluna única: Panorama, Lista, Dossiê. Empilhada abaixo do
     gráfico, a lista de pessoas só começava a mais de uma tela de rolagem —
     buscar alguém pelo nome, que é o gesto mais provável no celular, exigia
     atravessar gráfico, legenda e notas. Aqui ela é destino próprio, a um
     toque, e a barra de abas gruda no topo para a troca estar sempre à mão. */
  body[data-aba="lista"] #palcoConteudo,
  body[data-aba="lista"] .notas{display:none}
  body:not([data-aba="lista"]) .rail{display:none}
  .aba-lista{display:inline-block}
  .volta-lista{display:inline-flex;margin-bottom:12px}
  .abas{position:sticky;top:0;z-index:30;background:var(--paper);
        margin:0 -14px 14px;padding:0 14px;
        overflow-x:auto;-webkit-overflow-scrolling:touch}
  .aba{padding:12px 13px;font-size:11.5px;white-space:nowrap;flex:none;
       min-height:46px}
  .aba .num{font-size:11px;color:var(--ink3);margin-left:5px}
  .aba[aria-selected="true"] .num{color:var(--ink2)}

  .gaveta-bt{display:flex;align-items:center;justify-content:space-between;
             width:100%;font-family:var(--mono);font-size:12.5px;padding:9px 12px;
             border:1px solid var(--rule2);background:var(--paper);
             color:var(--ink);cursor:pointer;min-height:46px}
  .gaveta-bt b{color:var(--accent);font-weight:600}

  /* o cabeçalho quebra em vez de cortar a frase no meio com reticências */
  header{padding:12px 14px 11px;flex-wrap:wrap;gap:6px 12px;align-items:center}
  header > div:first-child{flex:1 1 220px}
  header h1{font-size:21px}
  header p{font-size:13px;white-space:normal;overflow:visible;text-overflow:clip}
  .selo{font-size:11px}
  .quadro{padding:10px}
  .ficha h2{font-size:22px}
  .dado{font-size:12.5px}
  .rodape{font-size:12px}
  .vazio{font-size:16px;padding:26px 0}

  /* alvos de toque de 44px para cima — antes iam de 17px (voltar) a 32px */
  .voltar-painel{display:flex;align-items:center;min-height:44px;
                 padding:6px 14px 0;font-size:12.5px}
  .tema{min-height:42px;padding:10px 13px;font-size:12px}
  .bt{min-height:42px;padding:10px 13px;display:inline-flex;align-items:center;
      justify-content:center}
  .chip{padding:9px 13px;font-size:12.5px;display:inline-flex;align-items:center;
        min-height:40px}
  .tri-ops button{min-height:46px;font-size:12px}
  .tri-rot{font-size:13.5px}
  .limpar{min-height:44px;display:inline-flex;align-items:center;font-size:13.5px}
  .mais{min-height:48px;font-size:12.5px;padding:12px 6px}
  .item{padding:11px 8px 11px 10px;min-height:56px}
  /* no celular há largura de sobra: o nome inteiro cabe em duas linhas, e dois
     xarás deixam de terminar na mesma reticência */
  .item .nm{white-space:normal;font-size:14.5px}
  .item .sub{font-size:11.5px}
  .item .mult{font-size:14.5px}
  .busca{font-size:16px;padding:11px}   /* 16px evita o zoom automático do iOS */
  select{font-size:16px;padding:11px 8px}
  .ordena select{font-size:16px}
  .lista{max-height:none}
  .contagem{padding:11px 0}

  /* recorte da tela em paisagem no aparelho com entalhe */
  header,.palco,.rail,.voltar-painel{
    padding-left:max(14px,env(safe-area-inset-left));
    padding-right:max(14px,env(safe-area-inset-right))}
  .rail{padding-bottom:max(24px,env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .legenda{gap:9px;font-size:11px}
  th,td{padding:5px 6px;font-size:12px}
}
/* Sete colunas de mono não cabem num telefone, e rolar de lado para ler uma
   linha é pior do que não ler. Abaixo de 560px cada declaração vira um cartão
   com rótulo à esquerda e valor à direita — mesma tabela, mesma marcação. */
@media (max-width:560px){
  .cartoes{background-image:none;overflow-x:visible}
  .cartoes table,.cartoes tbody,.cartoes tr,.cartoes td{display:block;width:100%}
  .cartoes thead{display:none}
  .cartoes tr{border:1px solid var(--rule);padding:9px 11px;margin-bottom:10px}
  .cartoes td{display:flex;align-items:baseline;justify-content:space-between;
              gap:14px;padding:4px 0;border-bottom:none;text-align:right;
              white-space:normal;font-size:13px}
  .cartoes td::before{content:attr(data-rot);flex:none;color:var(--ink3);
                      font-size:10px;letter-spacing:.06em;text-transform:uppercase;
                      font-family:var(--mono);text-align:left}
  .cartoes td:first-child{border-bottom:1px solid var(--rule);padding-bottom:7px;
                          margin-bottom:5px;font-size:14px;color:var(--ink)}
  .cartoes td:first-child::before{content:none}
  /* o cabeçalho do cartão é uma linha de texto, não um par rótulo-valor: sem
     isto o space-between joga a descrição do bem para a direita e a deixa a
     meia tela de distância do quadradinho que a classifica */
  .cartoes td.bem{justify-content:flex-start;text-align:left}
  /* tfoot não entra na regra de cima porque as outras tabelas em cartão não
     têm rodapé; sem ele aqui, o total encolhe numa caixinha solta no canto */
  .cartoes tfoot,.cartoes tfoot tr,.cartoes tfoot td{display:block;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="voltar-painel" href="https://rodado.xyz/analises/bens-dos-candidatos/">&larr; voltar à análise</a>
<header>
  <div>
    <p class="selo">rodado · registros da justiça eleitoral</p>
    <h1>O que o mandato pagou</h1>
    <p>Patrimônio declarado por quem foi eleito deputado federal, contra o subsídio do cargo.</p>
  </div>
  <button class="tema" id="btnTema" type="button">tema</button>
</header>

<div class="tela">
  <aside class="rail" id="rail" data-aberto="false">
    <div class="grupo">
      <label class="rotulo" for="q">Buscar pessoa</label>
      <input class="busca" id="q" type="search" placeholder="nome ou sobrenome"
             autocomplete="off" enterkeyhint="search">
    </div>

    <button class="gaveta-bt" id="gaveta" type="button" aria-expanded="false"
            aria-controls="rail">
      <span>Filtros</span><b id="gavetaSelo">nenhum</b>
    </button>

    <div class="grupo so-gaveta">
      <span class="rotulo">Espectro</span>
      <div class="chips" id="fEspectro"></div>
    </div>

    <div class="grupo so-gaveta">
      <label class="rotulo" for="fPartido">Partido no último registro</label>
      <select id="fPartido"></select>
    </div>

    <div class="grupo so-gaveta">
      <label class="rotulo" for="fUf">Unidade da federação</label>
      <select id="fUf"></select>
    </div>

    <div class="grupo so-gaveta">
      <span class="rotulo">Recorte</span>
      <div id="recortes"></div>
    </div>

    <div class="contagem" id="contagem" role="status" aria-live="polite"></div>
    <button class="limpar so-gaveta" id="limpar" type="button">limpar filtros</button>

    <div class="grupo">
      <label class="rotulo" for="fOrdem">Resultados, ordenados por</label>
      <select id="fOrdem"></select>
      <div class="lista" id="lista"></div>
    </div>
  </aside>

  <main class="palco">
    <div class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="panorama" aria-selected="true">Panorama</button>
      <button class="aba aba-lista" role="tab" data-aba="lista"
              aria-selected="false">Lista <b class="num" id="abaListaN"></b></button>
      <button class="aba" role="tab" data-aba="dossie" aria-selected="false">Dossiê</button>
    </div>
    <div id="palcoConteudo">
      <p class="carregando">Carregando as declarações de 1.025 pessoas…</p>
    </div>

    <details class="notas">
      <summary>Como ler estes números</summary>
      <div class="corpo" id="notas"></div>
    </details>
  </main>
</div>

<div class="dica" id="dica"></div>
<div class="cartao" id="cartao" role="dialog" aria-label="ponto do gráfico" hidden></div>
<noscript>
  <p class="vazio" style="padding:22px 18px">Este painel é interativo e precisa de
  JavaScript para carregar as declarações. A análise em texto, com os gráficos
  principais, está em <a href="https://rodado.xyz/analises/bens-dos-candidatos/">bens dos candidatos</a>.</p>
</noscript>
</body>
</html>
